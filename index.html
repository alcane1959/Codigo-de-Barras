<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gerador de códigos de barras e QR Code.">
  <title>Code Studio | Códigos de barras e QR Code</title>
  <link rel="icon" href="icon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="icon.ico" type="image/x-icon">
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--soft:#eef3f9;--text:#172033;--muted:#667085;--primary:#635bff;--border:#dfe5ee;--danger:#c92a2a;--ok:#087f5b;--shadow:0 18px 50px rgba(24,32,56,.1)}
    [data-theme="dark"]{--bg:#0e1320;--card:#171e2e;--soft:#20293a;--text:#f2f4f7;--muted:#a8b1c2;--primary:#8b83ff;--border:#303a4d;--danger:#ff8787;--ok:#63e6be;--shadow:0 18px 50px rgba(0,0,0,.28)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,rgba(99,91,255,.14),transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif} button,input,select,textarea{font:inherit} button{cursor:pointer}
    .app{width:min(1180px,calc(100% - 32px));margin:auto;padding:28px 0 48px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--primary),#22b8cf);font-size:22px;box-shadow:var(--shadow)}h1{font-size:clamp(1.15rem,3vw,1.55rem);margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:.9rem}
    .layout{display:grid;grid-template-columns:minmax(290px,390px) minmax(0,1fr);gap:22px;align-items:start}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}.controls,.history{padding:22px}.controls h2,.workspace h2,.history h2{margin:0 0 18px;font-size:1.1rem}.field{margin-bottom:16px}label{display:block;font-weight:650;margin-bottom:7px;font-size:.92rem}input,select,textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);background:var(--soft);outline:none}input,select{min-height:44px}textarea{min-height:118px;resize:vertical;line-height:1.45}.code-area{min-height:150px}.field-meta{display:flex;justify-content:space-between;gap:12px;margin-top:6px;color:var(--muted);font-size:.8rem}.field-meta small:last-child{white-space:nowrap}input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,91,255,.16)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.range-line{display:grid;grid-template-columns:1fr 58px;gap:10px;align-items:center}input[type=range]{padding:0;accent-color:var(--primary)}input[type=color]{padding:4px}.check{display:flex;align-items:center;gap:9px;color:var(--muted);margin:10px 0 18px}.check input{width:18px;min-height:18px}
    .btn{border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--text);min-height:42px;padding:10px 14px}.btn:hover{border-color:var(--primary);transform:translateY(-1px)}.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}.danger{color:var(--danger)}.full{width:100%}.message{min-height:22px;margin:12px 0 0;color:var(--danger);font-size:.88rem}
    .workspace{overflow:hidden}.workspace-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 0}.status{font-size:.82rem;color:var(--ok);background:rgba(8,127,91,.1);padding:6px 10px;border-radius:999px}.preview-area{padding:22px}.label-preview{background:#fff;color:#111;border:1px dashed #bac2cf;border-radius:14px;min-height:390px;display:grid;place-items:center;padding:34px;text-align:center;overflow:auto}.description{max-width:620px;margin:0 auto 18px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:1.05rem;font-weight:750;line-height:1.45}.price{margin:16px 0 0;font-size:1.3rem;font-weight:850}#barcode{display:block;max-width:100%;height:auto;margin:auto}#qrContainer{display:none;justify-content:center;align-items:center}#qrContainer canvas,#qrContainer img{max-width:100%;height:auto}.actions{display:flex;flex-wrap:wrap;gap:10px;padding:0 22px 22px}
    .history{margin-top:22px}.history-head{display:flex;justify-content:space-between;align-items:center}.history-head h2{margin:0}.history-list{margin-top:16px;display:grid;gap:10px}.history-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--soft);border:1px solid var(--border);border-radius:11px;padding:11px 12px}.history-item strong,.history-item small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.history-item small{color:var(--muted);margin-top:3px}.mini{padding:7px 9px;min-height:34px}.empty{color:var(--muted);text-align:center;padding:18px}footer{text-align:center;color:var(--muted);padding-top:25px;font-size:.86rem}
    @media(max-width:800px){.layout{grid-template-columns:1fr}}@media(max-width:480px){.app{width:calc(100% - 20px);padding-top:16px}.row{grid-template-columns:1fr}.brand p{display:none}.controls,.history,.preview-area{padding:16px}.workspace-head{padding:16px 16px 0}.actions{padding:0 16px 16px}.label-preview{padding:18px;min-height:330px}}
    @media print{body{background:#fff}.topbar,.controls,.workspace-head,.actions,.history,footer{display:none!important}.app,.layout,.workspace,.preview-area{width:100%;margin:0;padding:0;border:0;box-shadow:none;display:block}.label-preview{border:0;min-height:auto}}
  </style>
</head>
<body>
<main class="app">
  <header class="topbar"><div class="brand"><div class="logo">▥</div><div><h1>Code Studio</h1><p>Códigos de barras e QR Code</p></div></div><button id="themeBtn" class="btn" type="button">🌙 Tema</button></header>
  <section class="layout">
    <aside class="card controls">
      <h2>Configurar código</h2>
      <div class="field"><label for="type">Tipo de código</label><select id="type"><option value="CODE128">CODE 128</option><option value="EAN13">EAN-13</option><option value="UPC">UPC-A</option><option value="CODE39">CODE 39</option><option value="ITF14">ITF-14</option><option value="MSI">MSI</option><option value="QR">QR Code</option></select></div>
      <div class="field"><label for="code">Conteúdo do código</label><textarea id="code" class="code-area" maxlength="2000" rows="6" autocomplete="off" placeholder="Digite ou cole as informações que deseja codificar...">PRODUTO-001</textarea><div class="field-meta"><small id="hint">Aceita letras, números e símbolos.</small><small><span id="codeCount">11</span>/<span id="codeLimit">250</span></small></div></div>
      <div class="field"><label for="description">Descrição do produto</label><textarea id="description" maxlength="300" placeholder="Digite uma descrição mais completa do produto...">Produto de exemplo
Descrição detalhada do item</textarea></div>
      <div class="field"><label for="price">Preço</label><input id="price" type="text" maxlength="30" value="R$ 29,90"></div>
      <div id="barcodeOptions">
        <div class="field"><label for="barWidth">Largura das barras</label><div class="range-line"><input id="barWidth" type="range" min="1" max="4" step="0.25" value="2"><output id="barWidthValue">2</output></div></div>
        <div class="field"><label for="barHeight">Altura</label><div class="range-line"><input id="barHeight" type="range" min="50" max="180" step="5" value="100"><output id="barHeightValue">100</output></div></div>
      </div>
      <div id="qrOptions" hidden><div class="field"><label for="qrSize">Tamanho do QR Code</label><div class="range-line"><input id="qrSize" type="range" min="140" max="420" step="20" value="260"><output id="qrSizeValue">260</output></div></div></div>
      <div class="row"><div class="field"><label for="lineColor">Cor do código</label><input id="lineColor" type="color" value="#111111"></div><div class="field"><label for="bgColor">Cor de fundo</label><input id="bgColor" type="color" value="#ffffff"></div></div>
      <label class="check"><input id="showText" type="checkbox" checked> Mostrar conteúdo abaixo das barras</label>
      <button id="generateBtn" class="btn primary full" type="button">Gerar código</button><p id="message" class="message" role="alert" aria-live="polite"></p>
    </aside>
    <div>
      <section class="card workspace"><div class="workspace-head"><h2>Pré-visualização</h2><span class="status">● Pronto</span></div><div class="preview-area"><div id="labelPreview" class="label-preview"><div><p id="descriptionPreview" class="description"></p><svg id="barcode"></svg><div id="qrContainer"></div><p id="pricePreview" class="price"></p></div></div></div><div class="actions"><button id="pngBtn" class="btn primary" type="button">Baixar PNG</button><button id="svgBtn" class="btn" type="button">Baixar SVG</button><button id="printBtn" class="btn" type="button">Imprimir</button><button id="saveBtn" class="btn" type="button">Salvar no histórico</button></div></section>
      <section class="card history"><div class="history-head"><h2>Histórico local</h2><button id="clearBtn" class="btn danger mini" type="button">Limpar</button></div><div class="actions" style="padding:16px 0 0"><button id="backupBtn" class="btn primary" type="button">Fazer backup</button><button id="importBtn" class="btn" type="button">Importar backup</button><input id="importFile" type="file" accept="application/json,.json" hidden></div><p id="backupMessage" class="message" role="status" aria-live="polite"></p><div id="historyList" class="history-list"></div></section>
    </div>
  </section><footer>Projeto em HTML, CSS e JavaScript. QR Code aceita UTF-8. Os códigos lineares seguem as limitações de caracteres de cada padrão.</footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.12.3/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let currentType='CODE128';
const hints={CODE128:'Aceita ASCII: letras sem acento, números e símbolos comuns. Não aceita Ç, Ã ou emojis.',EAN13:'Aceita somente 12 ou 13 números.',UPC:'Aceita somente 11 ou 12 números.',CODE39:'Aceita A-Z, 0-9, espaço e os símbolos - . $ / + %. Não aceita acentos.',ITF14:'Aceita somente 13 ou 14 números.',MSI:'Aceita somente números.',QR:'Aceita UTF-8: Ç, Ã, acentos, símbolos, emojis, textos, links e contatos.'};
function updateUI(){currentType=$('type').value;const qr=currentType==='QR';$('barcodeOptions').hidden=qr;$('qrOptions').hidden=!qr;$('showText').closest('label').style.display=qr?'none':'flex';$('svgBtn').style.display=qr?'none':'inline-block';$('hint').textContent=hints[currentType];$('code').maxLength=qr?2000:250;$('codeLimit').textContent=$('code').maxLength;$('codeCount').textContent=$('code').value.length;generate()}
function setPreview(){const d=$('description').value.trim(),p=$('price').value.trim();$('descriptionPreview').textContent=d;$('descriptionPreview').style.display=d?'block':'none';$('pricePreview').textContent=p;$('pricePreview').style.display=p?'block':'none';$('labelPreview').style.backgroundColor=$('bgColor').value}
function validateValue(type,value){
if(type==='QR')return '';
if(type==='CODE128'&&/[^\x20-\x7E]/.test(value))return 'CODE 128 aceita apenas caracteres ASCII imprimíveis. Para Ç, Ã, acentos ou emojis, selecione QR Code.';
if(type==='EAN13'&&!/^\d{12,13}$/.test(value))return 'EAN-13 exige 12 ou 13 números.';
if(type==='UPC'&&!/^\d{11,12}$/.test(value))return 'UPC-A exige 11 ou 12 números.';
if(type==='CODE39'&&!/^[0-9A-Z\-. $/+%]+$/.test(value))return 'CODE 39 aceita apenas A-Z, 0-9, espaço e - . $ / + %.';
if(type==='ITF14'&&!/^\d{13,14}$/.test(value))return 'ITF-14 exige 13 ou 14 números.';
if(type==='MSI'&&!/^\d+$/.test(value))return 'MSI aceita somente números.';
return ''}
function generate(){const value=$('code').value.trim();$('codeCount').textContent=$('code').value.length;$('message').textContent='';setPreview();if(!value){$('message').textContent='Digite um conteúdo para gerar o código.';return false}const validation=validateValue(currentType,value);if(validation){$('message').textContent=validation;return false}if(currentType!=='QR'&&value.length>80){$('message').textContent='Para conteúdos longos, selecione QR Code. Códigos de barras lineares ficam largos e difíceis de ler.';return false}try{if(currentType==='QR'){if(typeof qrcode==='undefined')throw new Error('A biblioteca de QR Code não foi carregada. Verifique a internet.');$('barcode').style.display='none';$('qrContainer').style.display='flex';$('qrContainer').innerHTML='';qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];const qr=qrcode(0,'L');qr.addData(value,'Byte');qr.make();const modules=qr.getModuleCount(),size=+$('qrSize').value,quiet=4,total=modules+quiet*2,cell=Math.max(1,Math.floor(size/total)),canvas=document.createElement('canvas');canvas.width=canvas.height=cell*total;const ctx=canvas.getContext('2d');ctx.fillStyle=$('bgColor').value;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle=$('lineColor').value;for(let r=0;r<modules;r++){for(let c=0;c<modules;c++){if(qr.isDark(r,c))ctx.fillRect((c+quiet)*cell,(r+quiet)*cell,cell,cell)}}canvas.setAttribute('aria-label','QR Code com conteúdo em UTF-8');$('qrContainer').appendChild(canvas);}else{if(typeof JsBarcode==='undefined')throw new Error('A biblioteca de código de barras não foi carregada. Verifique a internet.');$('qrContainer').style.display='none';$('qrContainer').innerHTML='';$('barcode').style.display='block';JsBarcode('#barcode',value,{format:currentType,lineColor:$('lineColor').value,background:$('bgColor').value,width:+$('barWidth').value,height:+$('barHeight').value,displayValue:$('showText').checked,margin:14,fontSize:16});}return true}catch(e){$('message').textContent=e.message||'Conteúdo inválido para o formato escolhido.';return false}}
function safeName(){return($('code').value||'codigo').replace(/[^a-z0-9_-]+/gi,'-').slice(0,45)}
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
function png(){if(!generate())return;if(currentType==='QR'){setTimeout(()=>{const canvas=$('qrContainer').querySelector('canvas');const img=$('qrContainer').querySelector('img');if(canvas)download(canvas.toDataURL('image/png'),safeName()+'.png');else if(img)download(img.src,safeName()+'.png')},50);return}const svg=$('barcode'),xml=new XMLSerializer().serializeToString(svg),blob=new Blob([xml],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{const c=document.createElement('canvas'),scale=3;c.width=img.width*scale;c.height=img.height*scale;const x=c.getContext('2d');x.scale(scale,scale);x.drawImage(img,0,0);download(c.toDataURL('image/png'),safeName()+'.png');URL.revokeObjectURL(url)};img.src=url}
function svg(){if(!generate()||currentType==='QR')return;const xml=new XMLSerializer().serializeToString($('barcode')),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml'}));download(url,safeName()+'.svg');setTimeout(()=>URL.revokeObjectURL(url),1000)}
function history(){try{return JSON.parse(localStorage.getItem('codeStudioHistory')||'[]')}catch{return[]}}
function validItem(item){return item&&typeof item==='object'&&['CODE128','EAN13','UPC','CODE39','ITF14','MSI','QR'].includes(item.type)&&typeof item.code==='string'&&typeof item.description==='string'&&typeof item.price==='string'}
function backup(){const data={app:'Code Studio',version:1,exportedAt:new Date().toISOString(),codes:history()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob);(()=>{const now=new Date(),pad=n=>String(n).padStart(2,'0'),year=now.getFullYear(),date=pad(now.getDate())+'-'+pad(now.getMonth()+1)+'-'+year,time=pad(now.getHours())+'h'+pad(now.getMinutes());download(url,'code_studio_'+year+'_'+date+'_'+time+'.json')})();setTimeout(()=>URL.revokeObjectURL(url),1000);$('backupMessage').style.color='var(--ok)';$('backupMessage').textContent=data.codes.length+' código(s) exportado(s) com sucesso.'}
function importBackup(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result),incoming=Array.isArray(parsed)?parsed:parsed.codes;if(!Array.isArray(incoming))throw new Error('O arquivo não contém uma lista de códigos.');const clean=incoming.filter(validItem).map((item,index)=>({id:Number.isFinite(item.id)?item.id:Date.now()+index,type:item.type,code:item.code.slice(0,2000),description:item.description.slice(0,300),price:item.price.slice(0,30)}));if(!clean.length)throw new Error('Nenhum registro válido foi encontrado.');const merged=[...clean,...history()].filter((item,index,list)=>index===list.findIndex(x=>x.type===item.type&&x.code===item.code)).slice(0,500);localStorage.setItem('codeStudioHistory',JSON.stringify(merged));render();$('backupMessage').style.color='var(--ok)';$('backupMessage').textContent=clean.length+' código(s) importado(s). Registros repetidos foram ignorados.'}catch(e){$('backupMessage').style.color='var(--danger)';$('backupMessage').textContent='Não foi possível importar: '+e.message}finally{$('importFile').value=''}};reader.onerror=()=>{$('backupMessage').style.color='var(--danger)';$('backupMessage').textContent='Não foi possível ler o arquivo selecionado.'};reader.readAsText(file,'UTF-8')}
function save(){if(!generate())return;const item={id:Date.now(),type:currentType,code:$('code').value,description:$('description').value,price:$('price').value};localStorage.setItem('codeStudioHistory',JSON.stringify([item,...history()].slice(0,15)));render();$('message').style.color='var(--ok)';$('message').textContent='Código salvo no histórico.';setTimeout(()=>{$('message').textContent='';$('message').style.color=''},1700)}
function render(){const host=$('historyList'),list=history();host.innerHTML='';if(!list.length){host.innerHTML='<div class="empty">Nenhum código salvo ainda.</div>';return}list.forEach(item=>{const row=document.createElement('div');row.className='history-item';const info=document.createElement('div'),strong=document.createElement('strong'),small=document.createElement('small');strong.textContent=(item.description||'Sem descrição').split('\n')[0];small.textContent=item.type+' • '+item.code;info.append(strong,small);const use=document.createElement('button');use.type='button';use.className='btn mini';use.textContent='Usar';use.onclick=()=>{$('type').value=item.type;$('code').value=item.code;$('description').value=item.description;$('price').value=item.price;updateUI();scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.type='button';del.className='btn danger mini';del.textContent='Excluir';del.onclick=()=>{localStorage.setItem('codeStudioHistory',JSON.stringify(history().filter(x=>x.id!==item.id)));render()};const acts=document.createElement('div');acts.append(use,del);row.append(info,acts);host.append(row)})}
$('type').addEventListener('change',updateUI);$('code').addEventListener('input',()=>{$('codeCount').textContent=$('code').value.length});['code','description','price','barWidth','barHeight','qrSize','lineColor','bgColor','showText'].forEach(id=>$(id).addEventListener('input',()=>{$('barWidthValue').textContent=$('barWidth').value;$('barHeightValue').textContent=$('barHeight').value;$('qrSizeValue').textContent=$('qrSize').value;generate()}));$('generateBtn').onclick=generate;$('pngBtn').onclick=png;$('svgBtn').onclick=svg;$('printBtn').onclick=()=>{if(generate())print()};$('saveBtn').onclick=save;$('backupBtn').onclick=backup;$('importBtn').onclick=()=>$('importFile').click();$('importFile').addEventListener('change',e=>importBackup(e.target.files[0]));$('clearBtn').onclick=()=>{localStorage.removeItem('codeStudioHistory');render();$('backupMessage').textContent=''};$('themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';$('themeBtn').textContent=dark?'🌙 Tema':'☀️ Tema'};updateUI();render()})();
</script>
</body></html>
